<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Food Donation Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">🍲</div> Food Donation</div>
  <div class="top-right">
    <button class="icon-btn" onclick="toggleTheme()" title="Dark/Light">🌓</button>
    <div class="bell-wrap">
      <button class="icon-btn" id="bell" title="Notifications">🔔</button><span class="dot" id="dot" style="display:none">0</span>
      <div class="panel" id="panel"></div>
    </div>
    <div class="chip-user" id="who"></div>
    <button class="btn sm ghost" onclick="API.logout()">Logout</button>
  </div>
</header>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="app"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
